<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>welcome to game </h2>
    <div class="interface">
    <div class="imgbox user">
       <p class="choice" id="userc">user choice</p>
<div class="imagecon "id="paper">
    <img src="images/paper.png" alt="paper">
</div>
<div class="imagecon" id="rock">
    <img src="images/rock.png" alt="paper">
</div>
<div class="imagecon"id="scissors">
    <img src="images/scissors.png" alt="paper">
</div>
</div>
<div class="imgbox comp">
    <p class="choice" id="compc">comp choice</p>
<div class="imagecon "id="papercomp">
    <img src="images/paper.png" alt="paper">
</div>
<div class="imagecon" id="rockcomp">
    <img src="images/rock.png" alt="paper">
</div>
<div class="imagecon"id="scissorscomp">
    <img src="images/scissors.png" alt="paper">
</div>
</div>
</div>
<div class="scoreboard">

    <div class="msgcon">
        <p id="msg">user choice beats comp choice</p>
    </div>

    <div class="score">

        <div class="scorebox">
            <p>User Score</p>
            <p id="userscore">0</p>
        </div>

        <div class="scorebox">
            <p>Comp Score</p>
            <p id="compscore">0</p>
        </div>

    </div>

</div>
    <script src="script.js"></script>
</body>
</html>
