<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game">
        <div class="head">
            <div class="stgamemodel">
                <h3 class="heading">welcome to Snake Game</h3>
                <button class="btn" id="stbtn"> START GAME</button>
            </div>
            <div class="resetgamemodel">
                <h3 class="heading">GAME OVER</h3>
                <button class="btn" id="resetbtn"> RESET GAME</button>
            </div>
        </div>
        <div class="scoreboard">
            <div class="scorebox">
                <h4>highscore:</h4>
                <p class="highscore">0</p>
            </div>
            <div class="scorebox">
                <h4>score:</h4>
                <p class="score"> 0</p>
            </div>
            <div class="scorebox">
                <h4>Time</h4>
                <p class="time">00-00</p>
            </div>
        </div>
        <div class="board">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
